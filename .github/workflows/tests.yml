name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "nthu_scraper/**"
      - "tests/**"
      - "*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-build

      - name: Run tests
        run: uv run --frozen --no-build --no-sync pytest -q

      - name: Check lint
        run: uv run --frozen --no-build --no-sync ruff check .

      - name: Check formatting
        run: uv run --frozen --no-build --no-sync ruff format --check .

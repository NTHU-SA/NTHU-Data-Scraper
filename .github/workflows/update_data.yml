name: Crawl and update data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-data
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  DATA_FOLDER: data

jobs:
  crawl_and_update:
    name: Crawl and publish data snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.2

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-build

      - name: Hydrate previous published snapshot
        shell: bash
        run: |
          git fetch origin data
          git worktree add --detach "$RUNNER_TEMP/published-data" origin/data
          rsync -a \
            --exclude=.git \
            --exclude=.nojekyll \
            --exclude=CNAME \
            --exclude=index.html \
            "$RUNNER_TEMP/published-data/" "$DATA_FOLDER/"

      - name: Validate hydrated baseline
        run: uv run --frozen --no-build --no-sync python validate_data.py --data-folder "$DATA_FOLDER"

      - name: Run announcements item spider
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: uv run --frozen --no-build --no-sync python -m scrapy crawl nthu_announcements_item

      - name: Run buses spider
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: uv run --frozen --no-build --no-sync python -m scrapy crawl nthu_buses

      - name: Run courses spider
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: uv run --frozen --no-build --no-sync python -m scrapy crawl nthu_courses

      - name: Run dining spider
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: uv run --frozen --no-build --no-sync python -m scrapy crawl nthu_dining

      - name: Run library spider
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: uv run --frozen --no-build --no-sync python -m scrapy crawl nthu_libraries

      - name: Validate and generate publishing files
        run: |
          uv run --frozen --no-build --no-sync python validate_data.py --data-folder "$DATA_FOLDER"
          uv run --frozen --no-build --no-sync python generate_file_detail.py
          uv run --frozen --no-build --no-sync python generate_index.py
          touch "$DATA_FOLDER/.nojekyll"
          uv run --frozen --no-build --no-sync python validate_data.py --data-folder "$DATA_FOLDER"

      - name: Publish snapshot to data branch
        shell: bash
        run: |
          published="$RUNNER_TEMP/published-data"
          cname_file="$RUNNER_TEMP/CNAME"
          if [[ -f "$published/CNAME" ]]; then
            cp "$published/CNAME" "$cname_file"
          fi

          find "$published" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$DATA_FOLDER/." "$published/"
          if [[ -f "$cname_file" ]]; then
            cp "$cname_file" "$published/CNAME"
          fi

          git -C "$published" config user.name "github-actions[bot]"
          git -C "$published" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$published" add -A

          if git -C "$published" diff --cached --quiet; then
            echo "No published data changes."
            exit 0
          fi

          message_file="$RUNNER_TEMP/data-commit-message.txt"
          (
            cd "$published"
            python "$GITHUB_WORKSPACE/generate_data_commit_message.py"
          ) > "$message_file"
          git -C "$published" commit -F "$message_file"
          git -C "$published" push origin HEAD:data

name: Crawl and update data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */2 * * *" # 每兩小時執行一次
  workflow_dispatch: # 允許手動觸發

env:
  TZ: Asia/Taipei
  DATA_FOLDER: data

jobs:
  crawl_and_update:
    name: Crawl, Commit, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 確保有完整的 git 歷史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.2

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run spiders
        id: crawl
        shell: bash
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: |
          python -m scrapy crawl nthu_announcements_item
          python -m scrapy crawl nthu_buses
          python -m scrapy crawl nthu_courses
          python -m scrapy crawl nthu_dining

      - name: Run library spider
        # lib.nthu.edu.tw may reject requests from GitHub-hosted runner IPs.
        # Don't let that block the other datasets: the spider keeps the previous
        # JSON when a source fails. If it keeps failing, move this step to the
        # self-hosted runner (see workflow.md).
        continue-on-error: true
        env:
          DATA_FOLDER: ${{ env.DATA_FOLDER }}
        run: python -m scrapy crawl nthu_libraries

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "action@github.com"

      - name: Commit data updates
        shell: bash
        run: |
          git add -A "$DATA_FOLDER"
          # 使用 git status 檢查是否有實際的檔案變更
          if [[ -n "$(git status --porcelain "$DATA_FOLDER")" ]]; then
            echo "Data changes detected. Committing..."
            
            # 1. 預處理：移除 DATA_FOLDER 變數尾端可能多餘的斜線，避免路徑比對失敗
            CLEAN_FOLDER="${DATA_FOLDER%/}"
            
            # 2. 產生 commit 訊息
            cats=$(git status --porcelain "$DATA_FOLDER" \
              | awk '{print $2}' \
              | tr -d '"' \
              | cut -d '/' -f2 \
              | sed 's/\.json$//' \
              | sort -u \
              | paste -sd ",")
              
            git commit -m "📝 Scheduled update of JSON data [$cats] [skip ci]"
            git push
          else
            echo "No data changes."
          fi

      - name: Generate file details for Pages
        run: python generate_file_detail.py --data_folder=$DATA_FOLDER --json_path=$DATA_FOLDER/file_details.json

      - name: Generate index.html for Pages
        run: python generate_index.py --json_path=$DATA_FOLDER/file_details.json --output=$DATA_FOLDER/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DATA_FOLDER }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "🚀 Deploy updated data to gh-pages"